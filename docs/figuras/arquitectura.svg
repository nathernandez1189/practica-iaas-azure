<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="740" viewBox="0 0 1080 740" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de la práctica IaaS en Azure</title>
  <desc id="desc">Tres máquinas independientes, cada una con su propia red. Dos Ubuntu en Chile Central con SSH y una Windows en North Central US con RDP. Cuatro discos de 32 GiB.</desc>
