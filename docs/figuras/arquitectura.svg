      .small { font-size: 16px; fill: #47617a; }
      .label { font-size: 13px; letter-spacing: 1.4px; font-weight: 700; }
      .body { font-size: 18px; }
      .line { fill: none; stroke: #496b92; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
